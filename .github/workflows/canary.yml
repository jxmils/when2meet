name: When2meet canary

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read-only check of the maintainers' test polls
        env:
          # Maintainer-owned throwaway polls (see docs/WHEN2MEET_INTERNALS.md); override with the CANARY_POLLS variable.
          CANARY_POLLS: ${{ vars.CANARY_POLLS || 'https://www.when2meet.com/?38989176-ac4P8,https://www.when2meet.com/?38989243-bYl5e,https://www.when2meet.com/?38989819-AIwLK' }}
        run: npm run canary
      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="When2meet canary failed"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --title "$title" --body "The weekly read-only check of When2meet found a problem. Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. See docs/WHEN2MEET_INTERNALS.md."
          fi
