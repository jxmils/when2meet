name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build Chrome, Edge and Firefox
        run: npm run build:all
      - name: Lint the Firefox build
        run: npx web-ext lint --source-dir apps/extension/.output/firefox-mv3
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build the end-to-end variant (also runs on localhost)
        run: npm run build:e2e -w @w2msync/extension
      - name: End-to-end tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
      - name: Upload builds
        uses: actions/upload-artifact@v7
        with:
          name: extension-builds
          path: apps/extension/.output/*-mv3
