version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node types follow the Node major in .nvmrc (24); bump both together by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      development:
        dependency-type: development
      production:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
